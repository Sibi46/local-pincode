{% if request.user != business.user %}
{% if request.user.is_authenticated %}<form class="business-follow-form" method="post" action="{% url 'business_follow' business.company_id %}">{% csrf_token %}<input type="hidden" name="next" value="{{ request.get_full_path }}"><button class="business-follow-button" type="submit" name="action" value="{% if following %}unfollow{% else %}follow{% endif %}" aria-pressed="{% if following %}true{% else %}false{% endif %}">{% if following %}<i class="fas fa-check" aria-hidden="true"></i> Following{% else %}<i class="fas fa-plus" aria-hidden="true"></i> Follow{% endif %}</button></form>{% else %}<a class="business-follow-button" href="/login/?next={{ business.get_absolute_url|urlencode }}">Follow</a>{% endif %}
{% endif %}
