{% load static %}
{% if not request.user.is_authenticated %}
<link rel="stylesheet" href="{% static 'css/welcome-intro.css' %}?v=2">
<dialog id="welcomeIntro" class="welcome-intro" aria-labelledby="local-welcome-title" aria-describedby="local-welcome-description">
  <div class="welcome-shell">
    <header class="welcome-header">
      <span class="welcome-brand">OUR<span>PINCODE</span></span>
      <button type="button" class="welcome-skip" data-welcome-skip>Skip intro <i class="fas fa-arrow-right" aria-hidden="true"></i></button>
    </header>
    {% include 'home/welcome.html' %}
    <footer class="welcome-footer"><p>Your neighbourhood is waiting.</p><button type="button" class="welcome-next" data-welcome-complete>Start exploring <i class="fas fa-arrow-right" aria-hidden="true"></i></button></footer>
  </div>
</dialog>
<script src="{% static 'js/welcome-intro.js' %}?v=2" defer></script>
{% endif %}
